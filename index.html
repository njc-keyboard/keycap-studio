<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>キーキャップ工房</title>
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
  :root { --ink: #1A1A1A; --sub: #5C5C5C; --border: #8A8A8A; --accent: #0A5BD6; --accent-dark: #0848AB; --error: #B3261E; color-scheme: light; }
  html, body { margin: 0; height: 100%; background: #FFFFFF; }
  body { font-family: "BIZ UDPGothic", "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif; font-size: 15px; color: var(--ink); line-height: 1.5; }
  #gate { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; }
  #gate form { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 12px; }
  #gate h1 { font-size: 22px; margin: 0; }
  #gate p { margin: 0; color: var(--sub); }
  #gate label { font-size: 13px; color: var(--sub); }
  #gate input[type=password] { font: inherit; border: 1px solid var(--border); border-radius: 8px; padding: 0 12px; min-height: 44px; }
  #gate input[type=password]:focus-visible { outline: none; border: 2px solid var(--accent); padding: 0 11px; }
  #gate .remember { display: flex; align-items: center; gap: 8px; color: var(--ink); font-size: 15px; }
  #gate button { font: inherit; font-size: 17px; font-weight: 700; background: var(--accent); color: #fff; border: 0; border-radius: 8px; min-height: 48px; cursor: pointer; }
  #gate button:hover { background: var(--accent-dark); }
  #gate button:disabled { background: #E5E5E5; color: var(--sub); cursor: default; }
  #gate button:focus-visible, #gate input[type=checkbox]:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  #gate .err { color: var(--error); min-height: 1.5em; }
</style>
</head>
<body>
<div id="gate">
  <form id="f" autocomplete="on">
    <h1>キーキャップ工房</h1>
    <p>3D プリンターで刷るキーキャップを作る道具です。配った人から聞いたパスワードで開きます。</p>
    <input type="text" name="username" value="keycap" autocomplete="username" hidden>
    <label for="pw">パスワード</label>
    <input type="password" id="pw" autocomplete="current-password" required autofocus aria-describedby="err">
    <label class="remember"><input type="checkbox" id="remember"> この端末で覚えておく</label>
    <button id="go">開く</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</div>
<script>
(() => {
  const ITER = 600000;
  const KEY_STORE = "keycap.key";
  const $ = (id) => document.getElementById(id);
  const b64 = (u8) => btoa(String.fromCharCode(...u8));
  const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  let blob = null;

  async function payload() {
    if (!blob) {
      const r = await fetch("app.bin", { cache: "no-cache" });
      if (!r.ok) throw new Error("app.bin を読めません（" + r.status + "）");
      blob = new Uint8Array(await r.arrayBuffer());
    }
    return { salt: blob.slice(3, 19), iv: blob.slice(19, 31), data: blob.slice(31) };
  }
  async function keyFrom(pw, salt) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: ITER, hash: "SHA-256" }, base,
      { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
  }
  async function open(key, iv, data) {
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, data); // 鍵が違えば、ここで失敗する
    const text = await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
    return JSON.parse(text);
  }
  function start(b) {
    const base = new URL("./", location.href).href;
    const fix = (src) => src.split("__BASE__").join(base);
    const url = (src) => URL.createObjectURL(new Blob([fix(src)], { type: "text/javascript" }));
    window.__KC = { base, files: b.files, py: b.py, workerUrl: url(b.worker) };
    const style = document.createElement("style");
    style.textContent = b.css;
    document.head.append(style);
    document.body.innerHTML = b.shell;
    import(url(b.app));
  }
  async function tryStored() {
    const s = localStorage.getItem(KEY_STORE);
    if (!s) return false;
    $("f").hidden = true; // 覚えた鍵で開いている間は、入力の画面を出さない
    const wait = document.createElement("p");
    wait.textContent = "開いています…";
    wait.setAttribute("role", "status");
    $("gate").append(wait);
    try {
      const { iv, data } = await payload();
      const key = await crypto.subtle.importKey("raw", unb64(s), "AES-GCM", false, ["decrypt"]);
      start(await open(key, iv, data));
      return true;
    } catch {
      localStorage.removeItem(KEY_STORE); // パスワードが変わった
      wait.remove();
      $("f").hidden = false;
      $("err").textContent = "パスワードが変わりました。新しいパスワードを入れてください";
      $("pw").focus();
      return false;
    }
  }
  $("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("err").textContent = "";
    $("go").disabled = true;
    $("go").textContent = "確かめています…";
    try {
      const { salt, iv, data } = await payload();
      const key = await keyFrom($("pw").value, salt);
      let b;
      try { b = await open(key, iv, data); } catch {
        $("err").textContent = "パスワードが違います。大文字・小文字、全角・半角を確かめてください。分からないときは、配った人に聞いてください";
        $("pw").setAttribute("aria-invalid", "true");
        $("go").disabled = false;
        $("go").textContent = "開く";
        $("pw").select();
        return;
      }
      if ($("remember").checked) {
        try { localStorage.setItem(KEY_STORE, b64(new Uint8Array(await crypto.subtle.exportKey("raw", key)))); } catch { /* 覚えられない環境 */ }
      }
      start(b);
    } catch (err) {
      $("err").textContent = "開けませんでした（" + (err.message || err) + "）。読み込み直してください";
      $("go").disabled = false;
      $("go").textContent = "開く";
    }
  });
  if (!window.crypto?.subtle || !window.DecompressionStream) {
    $("err").textContent = "このブラウザでは開けません。新しい Firefox・Chrome・Safari・Edge でお試しください";
    $("go").disabled = true;
  } else {
    tryStored();
  }
})();
</script>
</body>
</html>
